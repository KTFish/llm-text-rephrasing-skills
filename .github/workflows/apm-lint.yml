name: APM lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  apm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/apm-action@v1
        with:
          setup-only: "true"
          apm-version: "0.33.0"
      - run: |
          apm audit --ci